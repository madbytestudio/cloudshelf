<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudShelf Payment</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1e1e1e;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 28px;
      text-align: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    p { color: #aaa; line-height: 1.5; margin: 0 0 20px; }
    .btn {
      display: inline-block;
      background: #396cd8;
      color: #fff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
    }
    .auto-msg { font-size: 0.8rem; color: #888; margin-top: 16px; margin-bottom: 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Payment received</h1>
    <p id="message">Return to the CloudShelf Reader app and tap <strong>Verify payment</strong> to finish unlocking your book.</p>
    <a class="btn" id="openAppBtn" href="cloudshelf://payment-return">Open CloudShelf App</a>
    <p class="auto-msg" id="autoMsg">Redirecting to app in <span id="countdown">3</span>s...</p>
  </div>
  <script>
    (function () {
      var params = Object.fromEntries(new URLSearchParams(location.search));
      var purchaseId = params.purchase_id || params.purchaseId || params.id || "";
      var billCode = params.billcode || params.BillCode || "";
      var status = params.status || "";

      try {
        localStorage.setItem("cloudshelf_chip_return", JSON.stringify({
          ...params,
          at: Date.now()
        }));
      } catch (e) {
        console.warn(e);
      }

      if (status === "failed" || status === "cancelled") {
        document.getElementById("title").textContent =
          status === "cancelled" ? "Payment cancelled" : "Payment failed";
        document.getElementById("message").textContent =
          "No payment was completed. Return to the app and try again.";
      }

      var query = purchaseId
        ? "?purchase_id=" + encodeURIComponent(purchaseId)
        : billCode
          ? "?billcode=" + encodeURIComponent(billCode)
          : "";
      var deepLink = "cloudshelf://payment-return" + query;
      document.getElementById("openAppBtn").href = deepLink;

      var seconds = 3;
      var countdown = document.getElementById("countdown");
      var autoMsg = document.getElementById("autoMsg");
      var timer = setInterval(function () {
        seconds--;
        countdown.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(timer);
          try { window.location.href = deepLink; } catch (_) {}
          autoMsg.style.display = "none";
        }
      }, 1000);
    })();
  </script>
</body>
</html>
